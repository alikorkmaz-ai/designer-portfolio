<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpeg">
  <link rel="apple-touch-icon" href="/assets/favicon.jpeg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" id="name">Portfolio</a>
    <div class="language-switch" aria-label="Language selector">
      <button type="button" data-locale="tr">TR</button>
      <button type="button" data-locale="en">EN</button>
    </div>
    <nav>
      <a href="#work" id="navWork">Projeler</a>
      <a href="#about" id="navAbout">Hakkımda</a>
      <a href="#contact" id="navContact">İletişim</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow" id="role"></p>
        <h1 class="intro-title" id="intro">Fikirleri Görsel Hikayelere, Tasarımı Deneyime Dönüştürüyorum.</h1>
      </div>
      <div class="profile-panel">
        <span id="location"></span>
        <strong id="projectCount">0 projects</strong>
      </div>
    </section>

    <section class="studio-strip" id="studioStrip"></section>

    <section class="featured" id="featured"></section>

    <section class="work" id="work">
      <div class="section-title">
        <div>
          <p class="section-kicker" id="workKicker">Arşiv</p>
          <h2 id="workTitle">Seçili İşler</h2>
        </div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="project-grid" id="projectGrid"></div>
    </section>

    <section class="about" id="about">
      <div>
        <p class="section-kicker" id="aboutKicker">Profil</p>
        <h2 id="aboutTitle">Hakkımda</h2>
      </div>
      <p id="aboutText"></p>
    </section>

    <section class="contact" id="contact">
      <div>
        <p class="section-kicker" id="contactKicker">Ulaşılabilirlik</p>
        <h2 id="contactTitle">İletişim</h2>
      </div>
      <div class="contact-links">
        <a id="emailLink" href="#">Email</a>
        <a id="instagramLink" href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a id="linkedinLink" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </section>

    <footer class="site-footer">
      <a id="footerCredit" href="mailto:alikorkmaz.fizik@gmail.com">Designed by Ali Korkmaz</a>
    </footer>
  </main>

  <dialog id="projectDialog">
    <button class="dialog-close" type="button" aria-label="Close">×</button>
    <article class="project-detail">
      <div class="dialog-body">
        <p id="dialogMeta"></p>
        <h3 id="dialogTitle"></h3>
        <p id="dialogDescription"></p>
      </div>
      <div class="project-detail-media" id="dialogMedia"></div>
      <div class="related-projects">
        <p class="section-kicker" id="relatedKicker">Diğer işler</p>
        <div class="related-grid" id="relatedProjects"></div>
      </div>
    </article>
  </dialog>

  <script src="/site.js"></script>
</body>
</html>
